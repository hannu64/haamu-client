<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>haamu</title>
    <!-- Suppresses the favicon request outright. A 404 in the console of a
         security product is noise that hides the errors that matter. -->
    <link rel="icon" href="data:," />
    <!--
      ROADMAP step 8 — the interface. This replaced `client/demo/`, which was a
      harness, and the replacement is deliberate rather than tidying: the browser
      tests drove the harness, so every one of them proved something about a page
      nobody would ever ship. `feedback_verify_before_claiming` is the same lesson
      from another project — the artefact you test must be the artefact that runs.

      ⭐ THIS IS NOW EXACTLY HOW IT IS SERVED, and that sentence is the point of
      the change made on 2026-08-12. This comment used to say the opposite — that
      §6's headers came from Caddy in production while the Go path set none of
      them — and BOTH HALVES WERE WRONG. Caddy sets no security headers for
      anything on that box (privsend sets its own, in Go, which is what the
      sentence cited as precedent), and a production path that sets them did not
      exist. So §6's header block had never been applied to a single response in
      the life of this project, and this page quietly grew into a shape it
      forbids: an inline `<style>` block and 24 `style="…"` attributes, all of
      them blocked by `style-src 'self'`.

      ⚠️ The fix is not "remember to set the headers". `lpmd` now serves this page
      with §6's headers IN DEVELOPMENT TOO, so there is one path instead of two
      and the next drift of this kind fails in front of whoever caused it. The
      reason this went unnoticed for ten build steps is precisely that the
      development path was exempt.

      ⚠️⚠️ AND NOW THE SECOND RULE ABOUT THIS FILE, WHICH IS 2026-08-13's (D-083,
      and `test/copy.mjs`'s new section). **NO SENTENCE THE PRODUCT SAYS TO A
      PERSON MAY BE WRITTEN HERE.** Eighteen of them were, from step 8 onwards,
      and when the first user outside this project spent an evening with the live
      site, **every single "this reads badly / I do not understand this / that is
      the wrong word" complaint pointed at one of those eighteen.** The strings
      inside `ui/copy.js` drew a different and milder complaint — *true, but it
      does not tell me enough.*

      ➡️ A central copy file is not a filing convention, it is a review gate, and
      nothing failed when eighteen sentences walked past it. So the gate is now
      **enforced**: `test/copy.mjs` reads this file, extracts every text node and
      every `placeholder`, and fails on anything that `ui/copy.js` did not
      produce. The one exception is the masthead below, which the same suite
      checks against `copy.product` rather than allowing.
    -->
    <link rel="stylesheet" href="/app/app.css" />
    <!--
      D-139. ⚠️⚠️ IN `<head>`, BEFORE THE STYLESHEET HAS ANYTHING TO PAINT, AND
      DELIBERATELY NOT A MODULE. It stamps the stored theme choice on the root
      element; if that ran from `app/app.js` — deferred, at the end of `<body>` —
      the browser would have already painted in the theme the PHONE asked for, and
      somebody who chose dark on a light phone would watch a white flash on every
      load. `type="module"` is deferred by definition, so it cannot be one, and an
      inline script is forbidden by §6's `script-src 'self'` and by
      `TestShippedHTMLSatisfiesItsOwnCSP`. An external classic script is what is
      left, and it is four lines long for a reason — this one blocks rendering.
    -->
    <script src="/app/theme-boot.js"></script>
    <!--
      D-154/D-159, and it is here for `theme-boot.js`'s reason with one difference
      worth stating rather than leaving to be inferred. That one prevents a flash of
      the wrong COLOURS. This one prevents a flash of one SENTENCE: `app.css` drops
      the masthead gloss — *haamu is Finnish for ghost* — on `html[lang="fi"]`, and
      an attribute stamped after the first paint would show it and then take it away.

      ⚠️ It also sets what a screen reader picks its voice from and what a browser
      reads before offering to translate the page, and both are consulted early.

      ⚠️⚠️ NOT `type="module"`, for the same reason as the line above: a module is
      deferred by definition, and deferred is the whole fault. `test/lang.mjs` asserts
      both this tag's shape and that it is inside `<head>`.
    -->
    <script src="/app/lang-boot.js"></script>
  </head>
  <body>
    <main>
      <!--
        D-001 and D-083. `lpm` is the PROTOCOL namespace token: it is in every
        HKDF `info` string on every device, it is permanent, and it names the
        construction. It stood here as an `<h1>` for five build steps — the
        placeholder becoming the name by accident, which is the drift D-012
        predicted in those words. The product is `haamu`.

        ⚠️ It is static text rather than filled at boot, because it is the one
        thing that should still be on screen if the module fails to load. The
        suite checks it equals `copy.product.name` / `copy.product.gloss`.
      -->
      <!--
        D-139's app bar. TWO BLOCKS, ONE OF WHICH IS ON SHOW AT A TIME.

        ⚠️⚠️ THE WORDMARK BLOCK IS STATIC AND MUST STAY STATIC — the comment above
        is the reason, and `test/copy.mjs` asserts these two exact elements exist
        IN THIS FILE. A bar whose title were filled from `copy.js` at boot would
        satisfy neither, so the conversation gets a SECOND block beside this one
        and `barMode()` swaps which is shown. It never rewrites either.

        ⚠️ The three controls carry no letters, which is what keeps them out of the
        copy gate's way: `visibleText()` in `test/copy.mjs` filters on `/[A-Za-z]/`,
        so a glyph is not a sentence to it. Their accessible names ARE sentences and
        do come from `copy.js`, set as `aria-label` at boot.
      -->
      <div class="appbar">
        <!--
          ⚠️⚠️ D-191: THIS WAS THE TEXT GLYPH `←` AND THREE TESTERS COULD NOT SEE IT.
          One of them described it exactly: *"it looks like a narrow line"*. That is
          what U+2190 IS in a system UI font — a hairline stroke with a small head,
          sized by `font-size` and thickened by nothing, because a symbol has no bold
          face to switch to. So the fix could not come from the type scale, and every
          adjustment available to a text glyph had already been spent.

          ⚠️ IT IS DRAWN, NOT LETTERED, SO THE COPY GATE IS UNAFFECTED. `visibleText()`
          in `test/copy.mjs` matches text nodes carrying `[A-Za-z]`; path data lives in
          an attribute and this element still has no text of its own. Its accessible
          name is still `copy.menu.back` set as `aria-label` at boot, exactly as before
          — `aria-hidden` on the shape is what keeps the two from being read twice.
        -->
        <button id="bar-back" class="iconbtn hidden">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M20 12H5m0 0 7-7m-7 7 7 7" />
          </svg>
        </button>
        <div id="bar-chat" class="barchat hidden">
          <div class="who">
            <h2 id="chat-name" class="m0"></h2>
            <span id="live" class="live connecting"></span>
          </div>
        </div>
        <header class="masthead" id="bar-brand">
          <h1 class="wordmark">haamu</h1>
          <p class="gloss">haamu is Finnish for ghost</p>
        </header>
        <button id="bar-menu" class="iconbtn" aria-haspopup="true" aria-expanded="false">⋮</button>
        <!--
          §7.6's Ghost mode leaves nothing behind, so it never WRITES a theme
          preference — see `ui/theme.js`. The menu still opens there: reading a
          choice somebody already made costs nothing, and hiding the control would
          be a second, unexplained difference between the two modes.
        -->
        <div id="menu" class="menu hidden" role="menu">
          <!--
            ⚠️⚠️ THESE FOUR MOVED HERE FROM UNDER THE COMPOSER, AND THE MEASUREMENT
            IS WHY. With them below it, the composer's bottom edge sat at 627px of an
            880px window: a quarter of the conversation screen spent on three
            controls and a paragraph, and the one control a person uses constantly
            pushed up out of the thumb's reach. WhatsApp puts exactly these in the
            bar's overflow menu and leaves the composer on the floor of the screen.

            ⚠️ `#back-home` STAYS EVEN THOUGH THE BAR HAS AN ARROW. It is hidden in
            Ghost mode by `show("back-home", !isGhost())` — §7.6 has no list to go
            back to — and that is a rule about a mode, not about a widget. Deleting
            the button would move the rule onto the arrow, silently, in a design pass.
          -->
          <!--
            ⚠️⚠️ ROUND 19. Hannu — who has used every build of this app — *"searched
            for it a long time"* for the ＋. A floating button is discoverable to
            somebody who already expects floating buttons; the person who has learned
            this product's own list of links is not that person.

            ⚠️ SO THIS IS A SECOND DOOR, NOT A REPLACEMENT. WhatsApp itself puts New
            group and New broadcast in exactly this menu, and the two naming the SAME
            act is the point rather than a duplication to tidy up later.

            ⚠️ D-192 ANSWERED ROUND 19'S COMPLAINT AT THE SOURCE and this door stays
            anyway. The ＋ is no longer floating or wordless — it is a labelled button
            at the top of the list — so the argument above is now about a control that
            no longer exists in that form. The entry is kept because a person who has
            learned to look in this menu must keep finding it here, which is the same
            reason it was added.
          -->
          <div id="menu-home" class="menu-group hidden">
            <button id="menu-create" class="secondary edged"></button>
          </div>
          <div id="menu-chat" class="menu-group hidden">
            <button id="back-home" class="secondary edged"></button>
            <button id="rename" class="secondary"></button>
            <button id="delete" class="danger"></button>
            <!-- Ghost mode has no list to delete from, so deleting this conversation
                 and ending the session are one act and there is one button. -->
            <button id="ghost-end" class="danger hidden"></button>
          </div>
          <p class="menu-label" id="menu-theme-label"></p>
          <button id="theme-system" role="menuitemradio" aria-checked="false"></button>
          <button id="theme-light" role="menuitemradio" aria-checked="false"></button>
          <button id="theme-dark" role="menuitemradio" aria-checked="false"></button>
          <!--
            D-159's language control, beside the colours because it is the same kind
            of thing: a preference about the interface, not a step in anything.

            ⚠️⚠️ IT IS A GROUP THAT COMES AND GOES, AND THAT IS NOT A TIDINESS CHOICE.
            Changing language means REDRAWING WHATEVER IS ON SCREEN, and `RERENDER` in
            `app.js` says for each screen how that is done — or that it cannot be done
            safely there, which is true of every screen with something in flight: a
            pairing halfway through, a phrase being confirmed, a link being typed. On
            those, `only()` hides this group rather than offering a control that would
            leave half the page in the old language. The table is exhaustive over
            `SCREENS` and `test/lang.mjs` fails if a screen is ever added without an
            answer, so this cannot rot into a silent blank spot.

            ⚠️ The two options are NOT translated — each language is named in itself.
            See `copy.menu.english`. They are also the reason this group is `hidden`
            in the markup: `only()` decides, and a group that started visible would
            flash on the gate before the first `only()` call reached it.

            ⚠️ DELIBERATELY NOT `class="menu-group"`. That class carries a behaviour —
            `$("menu")`'s listener closes the menu when anything inside one is pressed
            — and it is right for items that navigate and wrong here for the theme
            buttons' reason: the menu has to stay open so the tick can be seen to move,
            and here so that the person watches the menu itself change language.
          -->
          <div id="menu-lang" class="hidden">
            <p class="menu-label" id="menu-lang-label"></p>
            <button id="lang-en" role="menuitemradio" aria-checked="false"></button>
            <button id="lang-fi" role="menuitemradio" aria-checked="false"></button>
          </div>
        </div>
      </div>

      <!--
        ⚠️ EVERYTHING BELOW SCROLLS AND THE BAR ABOVE DOES NOT, which is the whole
        reason this wrapper exists. `only()`'s note about two scrolls — the log box,
        and the page the log box sits in — described the OLD layout, where the
        composer was part of the document and left the screen as the conversation
        grew. Here the app is exactly the height of the window and this is the only
        scroller, so there is one scroll to get right instead of two.
      -->
      <div class="screens" id="screens">

      <!-- Notices sit above whatever screen is showing: §7.3.1a's quarantine and
           §7.3.2's freshness are things that happened to this device, not steps in
           a flow, and a person must not have to navigate to find them. -->
      <div id="notices"></div>

      <!--
        ⚠️ §7.2 REQUIRES THESE TO BE TWO DIFFERENT INTENTIONS, and it is the whole
        reason this is a gate rather than one phrase box. A mistyped phrase yields a
        different K_master, a different roster_id and a 404 — the SAME response as
        genuine first use. A client that resolved that ambiguity by creating leaves
        the user with an empty app, two identities, no error, and no way to tell
        which happened.
      -->
      <section id="gate" aria-labelledby="gate-title" class="panel hidden">
        <p id="gate-arrived" class="hidden"></p>
        <h2 id="gate-title"></h2>
        <!--
          D-083, feedback 1. What a person can repeat to a friend, before anything
          is asked of them. It used to open with a sentence about how many words
          the phrase has, which answers a question nobody had yet.
        -->
        <div id="gate-what"></div>
        <!--
          Round 5 item 1: `<p id="gate-intro">` stood here and is gone. It restated
          the second paragraph of `product.what` immediately below it — three facts,
          same order, shorter words — because it was written before that paragraph
          existed and nothing retired it when the better one arrived.
        -->
        <!--
          Round 5 item 1. These two were `class="rows"` — the CONVERSATION LIST's
          class, borrowed for its vertical stacking — and `.rows button` painted
          them both the same quiet grey, overriding the accent `#go-setup` was
          meant to have. `.choices` is layout only; the colour is on the buttons.
        -->
        <div class="choices">
          <button id="go-setup" class="choice"></button>
          <button id="go-enter" class="choice other"></button>
        </div>
        <!--
          Round 6 (D-110): `<p class="note" id="gate-no-reset">` stood here and is
          gone. It said "There is no account, no email address and no way to reset
          the passphrase" — §7.2's consequence, and it earned its place on the gate
          because it is the one thing about this product that surprises people
          afterwards. The second paragraph above now ends "We do not have it, and we
          cannot help you if you lose it", which is the same fact where the same
          reader meets it, in words they feel rather than parse. ⚠️ A fact absorbed
          into a better sentence has not been dropped; a fact absorbed into nothing
          has, and the checks were pointed at the surviving paragraph rather than
          deleted with the string (D-107).
        -->
        <!--
          §7.6's Ghost mode, in §7.6's own register — the one §7.4 cites for the
          longer-phrase link: present it, do not explain it, do not default to it.
          ⚠️ D-016b is why it is a plain link below the two real choices rather than
          a third equal button: Ghost is the paranoid user's deliberate act, and for
          a first-timer it is not a privacy feature at all — it is the state in
          which they lose everything.
        -->
        <!--
          Feedback 6 and 3. The mode had no NAME — the gate said "talk without
          setting up a phrase", the screen behind it was headed "one conversation,
          in this tab", and a person who used it had no word for what they used.
          It is called Ghost mode, which is the one piece of branding a user can
          derive for themselves from the product's own name.

          ⚠️ The note under it is not decoration. Feedback 3 is that arriving with
          somebody's link showed two choices and no third — because the third
          described a way to START a conversation, not a way to open one.
        -->
        <p class="note mt mb0 sep">
          <button id="go-ghost" class="linkish"></button>
        </p>
        <p class="note m0" id="go-ghost-what"></p>
        <!--
          Feedback 7 and 11: a place to paste a link, which is also the only route
          that keeps the secret out of the browser's address history.
        -->
        <p class="note mt">
          <button id="go-paste" class="linkish"></button>
        </p>
        <!--
          ⭐⭐ §7.3.1a REQUIRES THE PANIC ACTION TO BE REACHABLE FROM A DEVICE THE
          USER HAS NEVER USED BEFORE, WITH THE PHRASE ALONE — which is why it is
          HERE, on the gate, and not only inside an open session. "The scenario the
          action exists for is a device that is gone", so an app that offers the
          wipe only from an already-set-up device offers it exactly where it cannot
          be used. A plain secondary link, not a red button: somebody reaching for
          this is not in a state to be shouted at.
        -->
        <p class="note mt">
          <button id="go-panic" class="linkish"></button>
        </p>
      </section>

      <section id="setup" aria-labelledby="setup-title" class="panel hidden">
        <h2 id="setup-title"></h2>
        <p id="setup-choose" class="lead"></p>
        <div class="candidates" id="candidates"></div>
        <div class="row">
          <button id="chosen"></button>
          <button id="regen" class="secondary"></button>
        </div>
        <p class="note mt">
          <button id="longer" class="linkish"></button>
          <span id="sets"></span>
        </p>
      </section>

      <!--
        ⚠️⚠️ THIS PANEL IS NEW AND IT IS D-084 — A SECURITY DEFECT THE FIRST USER
        FOUND FROM A BUTTON LABEL. Until 2026-08-13 the chosen phrase was rendered
        on the SAME panel as the retype field, immediately above the sentence
        "typing it back is the only evidence that a copy of it exists outside this
        browser tab." It is not: it could be read off the screen a word at a time,
        or selected and copied in one click, because `.phrase` sets
        `user-select: all`. §7.4's whole purpose for the step was defeated by the
        layout while every line of code implementing it was correct.

        ➡️ **A test of knowledge must not be conducted with the answer visible.**
        Writing it down is one screen; typing it back is another; and both routes
        back here clear the field, so looking again costs the test again.
      -->
      <section id="write" aria-labelledby="write-title" class="panel hidden">
        <h2 id="write-title"></h2>
        <p id="write-down" class="lead"></p>
        <div class="phrase" id="chosen-phrase"></div>
        <div class="row mt-s">
          <button id="written"></button>
          <button id="write-back" class="secondary"></button>
        </div>
      </section>

      <section id="confirm" aria-labelledby="confirm-title" class="panel hidden">
        <h2 id="confirm-title"></h2>
        <!--
          Round 6 (D-110). `<p class="note" id="confirm-hidden">` stood under this
          and is gone: three sentences explaining why the KEY is off the screen, on
          a screen with one field waiting for an answer. The explanation moved to
          `terms.retype`, reachable from the marked words in `confirm-ask` itself —
          which is a <div> rather than a <p> because it can now grow a panel.
        -->
        <div id="confirm-ask" class="lead"></div>
        <input id="retype" class="field" type="text" autocomplete="off" autocapitalize="off"
               spellcheck="false" />
        <p class="note" id="retype-note"></p>
        <div class="row mt-s">
          <button id="confirmed"></button>
          <button id="show-phrase" class="secondary"></button>
          <button id="back-setup" class="secondary"></button>
        </div>
      </section>

      <section id="pasted" aria-labelledby="pasted-title" class="panel hidden">
        <h2 id="pasted-title"></h2>
        <p id="pasted-body"></p>
        <p class="mt"><button id="pasted-ok"></button></p>
      </section>

      <!--
        §2.1's link, pasted instead of navigated to — feedback 7 and 11.

        ⚠️⚠️ THE BUG UNDERNEATH FEEDBACK 7 IS NOT THIS PANEL, it is that `app.js`
        read `location.hash` once at boot. Pasting a link into the address bar of a
        tab already on `/c` changes only the fragment, so the browser fires
        `hashchange` and does not reload, and nothing looked. A new tab worked,
        which is what made it read as a mystery. The listener in `app.js` is the fix.

        ⭐ This panel is feedback 11 — *"no place to click to get to a neutral page"*
        — and it turns out to be the better of the two routes for a reason nobody
        asked about: **typing a link into the address bar puts the secret into the
        browser's history and its omnibox suggestions**, which §2.1's
        `history.replaceState` cannot reach. A field on the page does not.

        ⚠️ It checks the origin before it parses. `parseLink` accepts any string
        with a fragment, so a link for a different deployment would be turned into a
        `pairing_id` and claimed against THIS server. Navigation cannot do that.
      -->
      <!--
        ⚠️ ONE FIELD TAKES BOTH §2.1's LINK AND §2.2's SPOKEN CODE, and the id stays
        `paste-link` on purpose: renaming it would touch the harness, the browser
        checks and three call sites to describe something the user never sees. What
        the user sees is the label, and that says both.

        ⚠️ `autocapitalize="off"` matters more here than it did: a code is uppercase
        and a phone keyboard that helpfully capitalises would be harmless (normalise
        uppercases anyway) — but one that autocorrects a four-letter group into an
        English word is not, which is what `spellcheck="false"` is for.
      -->
      <section id="paste" aria-labelledby="paste-title" class="panel hidden">
        <h2 id="paste-title"></h2>
        <p class="note" id="paste-what"></p>
        <p class="note" id="paste-or-code"></p>
        <input id="paste-link" class="field" type="text" autocomplete="off" autocapitalize="off"
               spellcheck="false" />
        <p class="note" id="paste-note"></p>
        <div class="row mt">
          <button id="paste-go"></button>
          <button id="paste-back" class="secondary"></button>
        </div>
      </section>

      <section id="enter" aria-labelledby="enter-title" class="panel hidden">
        <h2 id="enter-title"></h2>
        <p id="enter-ask" class="lead"></p>
        <input id="phrase-in" class="field" type="text" autocomplete="off" autocapitalize="off"
               spellcheck="false" />
        <p class="note" id="enter-note"></p>
        <div class="row mt">
          <button id="unlock"></button>
          <button id="back-gate" class="secondary"></button>
        </div>
      </section>

      <!--
        D-145. ⚠️⚠️ THE BAR IS NOT DECORATION AND IT IS NOT A SPINNER. `copy.unlock`
        carries the reason in its own comment — *"a screen that looks frozen for a
        second is a screen people press again"* — and D-034 measured Argon2id at
        1.17 s on a decade-old Android, on EVERY unlock while §7.5's PRF is absent.
        This screen said "Opening — this takes a moment on purpose" and then did not
        move. ⭐ It is animated with `transform` alone, which is the whole point:
        this is the one screen in the product whose main thread is DELIBERATELY
        blocked, and a transform runs on the compositor. Anything driven by script,
        or by `width`, would stop dead at exactly the moment it is needed.
      -->
      <section id="working" class="panel hidden">
        <p id="working-note" class="lead"></p>
        <div class="working-bar" aria-hidden="true"><span></span></div>
        <p class="note" id="working-why"></p>
      </section>

      <!--
        D-139. The list is full-bleed and is the whole screen; everything that is
        not a conversation sits under it in `.listrest`, which keeps its padding.

        ⚠️ `#home-title` IS A QUIET LABEL RATHER THAN A PAGE HEADING, and this is
        one of the places Hannu's *"if WA does not have something similar we can
        improvise"* applies. WhatsApp's list screen has no heading — the bar says
        WhatsApp and the list begins. Deleting this element would mean deleting a
        `copy.list.title` that other things still name, so it stays as the list's
        label: small enough not to compete with the bar, present enough to head the
        empty state, and it is what a screen reader announces the list by.
      -->
      <section id="home" aria-labelledby="home-title" class="listpane hidden">
        <h2 id="home-title" class="listlabel"></h2>

        <!--
          ⚠️⚠️ D-192: `#create` IS THE FIRST THING UNDER THE HEADING AND IT IS NO LONGER A
          FLOATING CIRCLE. It was a 3.5rem circle in the bottom-right corner whose only
          word was an `aria-label`, and several testers could not find how to start a
          conversation at all — the one act this screen exists for. The note that used to
          sit here said *"a circular button 3.5rem across cannot hold 'Start a new
          conversation'"*, which was true and settled the question the wrong way round: it
          treated the circle as the fixed part and the words as the impossible one.

          ⚠️ AND THE FLOAT ITSELF WAS A HAZARD, MEASURED. An extended FAB was tried first
          and `probe-forget-key` and `probe-elsewhere-return` both went red on it: at their
          480px viewport the pill spanned x=202..464 while `#end-here` centres at 240, so a
          click aimed at *"Forget your KEY here"* landed on the pill instead. The circle had
          been narrow enough to miss a full-width button's centre and a labelled pill is
          not — ⛔ **the same collision `app.css` already recorded once**, when the circle
          sat *"squarely on top of"* the clear-everything control and was answered with
          bottom padding. Padding only clears the LAST element at full scroll; every other
          control still passes underneath. ➡️ A FLOATING CONTROL OVER A SCREEN OF CONTROLS
          IS A COLLISION WAITING FOR A WIDER LABEL, so this one stops floating.

          ⭐ Which is also what was asked for: *"How to send an invitation link should be

            removed the `text()` call in `app.js` and left an empty `<p>` sitting here,
            which the browser check found by listing the ids that were supposed to be
            gone. A renderer with no element fails loudly; an element with no renderer
            is invisible, and it is the direction that survives review.
          -->
          <div class="m0" id="unverified-what"></div>
          <p class="m0 mt-s"><button id="verify-now" class="secondary"></button></p>
        </div>
        <!--
          ⚠️ WHATSAPP'S "SYSTEM MESSAGE" — a centred chip on the wallpaper, which is
          where a messenger puts a statement the app is making about the conversation
          rather than something either person said. These four were scattered: one
          note above the log and three below the composer. They are the same KIND of
          sentence and they now look like it.

          ⚠️ ABOVE THE LOG RATHER THAN INSIDE IT, and that is a compromise worth
          naming. WhatsApp's system messages sit in the timeline and scroll away with
          it; `renderLog` calls `replaceChildren()` on `#log`, so anything placed
          inside would be erased on the next render. Putting them in the timeline
          properly is a change to the renderer, not to the layout — Phase 2.
        -->
        <div class="sysmsgs">
          <p class="sysmsg" id="chat-verified"></p>
          <p class="sysmsg" id="chat-local"></p>
          <p class="sysmsg" id="chat-ghost"></p>
          <p class="sysmsg" id="chat-ttl"></p>
        </div>

        <!-- D-130. This browser holds the conversation and has never held its keys —
             §6.3's "cleared storage, or device migration", which is what opening the
             app in a different browser IS. It sits ABOVE the log because in exactly
             this case the log is empty, and a note under an empty box is a note
             nobody reads. A `banner`, not an `alarm`: nothing is broken and nothing
             was attacked, there is one thing to do. -->
        <div id="chat-reconnect" class="banner hidden">
          <!-- ⚠️ ORDER IS THE INSTRUCTION, NOT THE EXPLANATION. What to do, then what it costs
               not to, then why. `why` sat in the MIDDLE until 2026-08-18, which put background
               between an instruction and its consequence — and Hannu's rewrite of these two
               sentences reads as one thought, so they have to be adjacent. -->
          <p class="m0" id="reconnect-what"></p>
          <p class="note" id="reconnect-cost"></p>
          <p class="note" id="reconnect-why"></p>
        </div>

        <!-- §6.7.1's closing notice, at the receiving end. -->
        <div id="chat-closed" class="banner alarm hidden">
          <p class="m0" id="closed-what"></p>
          <p class="note" id="closed-more"></p>
          <p class="note" id="closed-yours"></p>
          <p class="note" id="closed-next"></p>
        </div>

        <div id="log" class="log"></div>

        <!--
          ⚠️ THE SEND BUTTON IS A CIRCLE AND ITS LABEL IS AN `aria-label`. That is
          not styling for its own sake: D-104's rule was *"a filled accent is the
          one action on a screen"*, and D-139 puts a filled accent on every outgoing
          bubble, which breaks the rule as arithmetic. WhatsApp separates the two by
          SHAPE instead of colour. See `.send` in `app.css` — take the roundness off
          and the rule fails again, silently, on the screen it was written for.
        -->
        <!--
          ⚠️⚠️ A `<textarea>` AND NOT AN `<input>`, SINCE ROUND 19. An `<input>` cannot
          hold a newline at all — not a styling limitation but a value one, so no key
          binding could have made paragraphs work while this was an input.

          ⚠️ IT SHIPS WITH NO CONTENT AND NO `placeholder` ATTRIBUTE. `test/copy.mjs`
          reads text nodes and placeholders straight out of this file and fails on any
          the copy module did not produce; the placeholder is set at boot from
          `copy.chat.placeholder`, exactly as it was on the input.

          ⚠️ `rows="1"` IS THE FLOOR, NOT THE SIZE. app.js grows it to fit what is typed
          and `app.css` caps it, so the composer starts as one line and the conversation
          keeps the rest of the screen.
        -->
        <form id="composer" class="composer">
          <textarea id="text" rows="1" autocomplete="off"></textarea>
          <button id="send" class="send" type="submit">➤</button>
        </form>

      </section>

      <section id="tripwire" aria-labelledby="tripwire-title" class="panel alarm hidden">
        <h2 id="tripwire-title"></h2>
        <p id="tripwire-body"></p>
      </section>

      <section id="failure" aria-labelledby="failure-title" class="panel alarm hidden">
        <h2 id="failure-title"></h2>
        <p id="failmsg"></p>
        <p class="note" id="failcode"></p>
        <p class="mt"><button id="fail-back" class="secondary"></button></p>
      </section>

      <!--
        D-085. Feedback 13: Opera opened the page in about a second, Chrome took
        nearly ten, and that is NOT DIAGNOSED. `crypto/argon2.js` has recorded the
        cost of every derivation since it was written and nothing ever showed it.

        ⚠️ It goes nowhere. A product whose claim is that the server learns nothing
        does not acquire a telemetry channel to answer a performance question — the
        person holding the device reads the numbers out.
      -->
      <!--
        ⚠️ HIDDEN WHILE A CONVERSATION IS OPEN, AND THE REASON IS A MEASUREMENT.
        This footer is the last child of the scroller, so it takes its height from
        every screen including the conversation — which is a full-height pane whose
        composer is supposed to sit on the floor of the window. It measured 819px of
        an 880px window with this footer under it: sixty-one pixels of "Show timings"
        between the thing you type into and the bottom of the phone.

        D-085's timings are reachable from every other screen, which is where a
        person goes looking for them. WhatsApp has nothing here at all.
      -->
      <footer class="diag" id="diagfoot">
        <button id="diag-toggle" class="linkish"></button>
        <div id="diag" class="hidden">
          <p class="note m0" id="diag-note"></p>
          <pre class="diagbox" id="diag-body"></pre>
          <!--
            ⚠️ UNDER the readout and not beside the toggle, because the order is the
            instruction: what this is, what it says, and only then what you can do with
            it. A copy control above the numbers would offer to send something the
            person has not looked at yet, and the note directly above promises they can.
          -->
          <button id="diag-copy" class="linkish"></button>
        </div>
      </footer>
      </div><!-- /.screens -->
    </main>
    <script type="module" src="/app/app.js"></script>
  </body>
</html>
